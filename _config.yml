# ponytail: a stray root-owned build output was being ingested as posts, publishing
# every recipe a second time at the site root. Excluding it fixes the build without
# sudo; run `sudo rm -rf _posts/recipes/_site` and delete these three lines.
exclude:
  - _posts/recipes/_site
