<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>rain</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Chrome borrowed from watides: nautical palette, floating controls, bottom-sheet card. */
:root {
  --water: #BFDDEB;
  --coast: #4A6B7C;
  --ink: #1F3A45;
  --tide: #12507D;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--water); }
body { color: var(--ink); }
#map { width: 100vw; height: 100vh; background: var(--water); font: inherit; }

.panel {
  position: fixed; z-index: 1000; background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--coast); border-radius: 6px; padding: 6px 10px; font-size: 13px;
}
#status { top: calc(8px + env(safe-area-inset-top, 0px)); right: 8px; }
#status a { color: var(--tide); }
#legend { left: 8px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
#legend b { display: block; margin-bottom: 4px; }
#legend div { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; }
#legend i { display: inline-block; border-radius: 50%; border: 1px solid var(--ink); margin: 1px auto; }
#legend span { width: 26px; display: flex; }

#card {
  position: fixed; z-index: 1001; left: 0; right: 0; bottom: 0;
  margin: 0 auto 12px; max-width: 560px;
  padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: #fff; border-radius: 12px;
  box-shadow: 0 2px 14px rgba(31, 58, 69, 0.28);
  max-height: 70vh; overflow-y: auto;
}
#card .head { display: flex; align-items: flex-start; gap: 8px; }
#card .head > div { flex: 1; min-width: 0; }
#card h1 { margin: 0; font-size: 19px; font-weight: 600; }
#card .meta { margin-top: 2px; font-size: 13px; color: var(--tide); }
#card .meta a { color: inherit; }
#card h3 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--coast); }
#card table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
#card td, #card th { padding: 2px 8px 2px 0; text-align: left; font-weight: normal; white-space: nowrap; }
#card th { color: var(--coast); }
#card td.bar { width: 100%; }
#card td.wrap { white-space: normal; }
#card .scroll { overflow-x: auto; }
#card td.bar i { display: block; height: 10px; border-radius: 2px; min-width: 1px; }
#card tr.total td { border-top: 1px solid var(--coast); font-weight: 700; }
#card .big { font-family: var(--mono); font-size: 22px; font-weight: 700; }
#card pre { margin: 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--coast); }
button.bare { font: inherit; font-size: 14px; color: var(--tide); border: 0; background: none;
  padding: 6px 8px; cursor: pointer; }
</style>
</head>
<body>

<div id="map"></div>

<div id="status" class="panel"><a href="/">schmitztech</a> · <span id="msg">Loading…</span></div>

<div id="legend" class="panel"></div>

<section id="card" hidden>
  <div class="head">
    <div>
      <h1 id="name"></h1>
      <div class="meta" id="meta"></div>
    </div>
    <button class="bare" id="close" aria-label="Close">✕</button>
  </div>
  <div id="body"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Airport weather stations (ASOS/AWOS) via the Iowa Environmental Mesonet.
// Per state: one request for its stations and their current conditions, then
// one per day for daily summaries of the last three full days plus today,
// which is what the markers are coloured by.
const IEM = 'https://mesonet.agron.iastate.edu';
const TRACE = 0.0001; // IEM's code for "trace": rain fell, too little to measure.

// Lower bound (inches) of each bucket, with its colour. Light→dark blue up to
// 2", then purple, magenta, red and amber for the extremes; the wettest
// stations are also the biggest dots.
const BUCKETS = [
  [0, '#FFFFFF', '0'],
  [0.01, '#CFE3EE', '< 0.1'],
  [0.1, '#8DBFE0', '0.1 – 0.5'],
  [0.5, '#4A90C8', '0.5 – 1'],
  [1, '#12507D', '1 – 2'],
  [2, '#5B2A86', '2 – 4'],
  [4, '#C2187A', '4 – 6'],
  [6, '#E8442A', '6 – 8'],
  [8, '#F5B800', '8 +'],
];
const NO_DATA = '#D8D8D8';
const bucketOf = (total) => {
  let i = 0;
  while (i + 1 < BUCKETS.length && total >= BUCKETS[i + 1][0]) i++;
  return i;
};
const radiusOf = (b) => 3.5 + b * 1.1;

const num = (v) => (v === null || v === undefined || v === '' || v === 'None' ? null : Number(v));
const inches = (v) => (v === TRACE ? 0 : v);
// ponytail: a stuck gauge reports nonsense (149" in a day at Norfolk). Anything
// over this in one day is dropped; a real 20"+ day would be dropped too, which
// has happened in the US only in a handful of hurricanes.
const MAX_DAY = 20;

/** Sum of the days that reported; null when none did, so "no data" isn't drawn as "dry". */
function totalOf(days) {
  const got = days.map((d) => d.precip).filter((v) => v !== null);
  return got.length ? got.reduce((a, v) => a + inches(v), 0) : null;
}

// Station-local calendar dates. Eastern is the first US zone to start a day,
// so its date covers everyone's "today" without cutting off the east coast.
const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
const shift = (iso, n) => new Date(Date.parse(iso) + n * 864e5).toISOString().slice(0, 10);
const DATES = [3, 2, 1, 0].map((n) => shift(today, -n));

console.assert(bucketOf(0) === 0 && bucketOf(0.05) === 1 && bucketOf(1) === 4 && bucketOf(5) === 6 && bucketOf(7) === 7 && bucketOf(9) === 8, 'bucketOf');
console.assert(totalOf([{ precip: null }]) === null && totalOf([{ precip: TRACE }, { precip: 0.5 }]) === 0.5, 'totalOf');
console.assert(shift('2026-03-01', -1) === '2026-02-28', 'shift');

// --- Map ---
const map = L.map('map', { preferCanvas: true, zoomControl: false });
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 12,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · data <a href="https://mesonet.agron.iastate.edu">Iowa Environmental Mesonet</a>',
}).addTo(map);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

$('legend').innerHTML = `<b>Rain since ${dayName(DATES[0])} (in)</b>` +
  BUCKETS.map(([, color, label], b) => {
    const d = radiusOf(b) * 2;
    return `<div><span><i style="width:${d}px;height:${d}px;background:${color}"></i></span>${label}</div>`;
  }).reverse().join('') +
  `<div><span><i style="width:6px;height:6px;background:${NO_DATA};border-color:#999"></i></span>no data</div>`;

function dayName(iso) {
  return iso === today ? 'Today' :
    new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
}

function style(s) {
  if (s.total === null) return { radius: 3, fillColor: NO_DATA, color: '#999', weight: 1, fillOpacity: 0.9 };
  const b = bucketOf(s.total);
  return { radius: radiusOf(b), fillColor: BUCKETS[b][1], color: '#1F3A45', weight: 1, fillOpacity: 0.95 };
}

const stations = new Map(); // "network|id" → { cur, days, total, marker }
let selected = null;

// [south, west, north, east] of each state's stations, from IEM's station list.
// A state is fetched only once this whole box is on screen, so opening on
// Washington costs 5 requests rather than the ~265 the whole country does.
const BOX = {"AK":[51.8,-176.7,71.3,-131.5],"AL":[30.2,-88.3,34.9,-85.1],"AR":[33.2,-94.5,36.5,-89.8],"AZ":[31.4,-114.7,37.0,-109.0],"CA":[32.5,-124.3,41.8,-114.6],"CO":[37.1,-108.8,40.8,-102.2],"CT":[41.1,-73.5,42.0,-72.0],"DE":[38.6,-75.7,39.7,-75.3],"FL":[24.5,-87.4,30.9,-80.0],"GA":[30.7,-85.3,34.9,-81.1],"GU":[13.4,144.7,19.3,166.7],"HI":[19.7,-177.4,28.3,-155.0],"IA":[40.4,-96.4,43.5,-90.3],"ID":[42.2,-117.1,48.8,-111.0],"IL":[37.0,-91.2,42.5,-87.5],"IN":[38.0,-87.6,41.8,-84.8],"KS":[37.0,-101.9,40.0,-94.7],"KY":[36.6,-88.8,39.1,-82.5],"LA":[27.1,-93.9,32.8,-87.7],"MA":[41.2,-73.3,42.8,-69.9],"MD":[38.1,-79.4,39.8,-75.1],"ME":[43.3,-71.0,47.3,-67.7],"MI":[41.7,-90.2,47.5,-82.5],"MN":[43.6,-97.0,49.4,-90.3],"MO":[36.2,-95.0,40.4,-89.5],"MS":[30.3,-91.3,35.0,-88.1],"MT":[44.6,-115.0,48.9,-104.1],"NC":[33.9,-83.5,36.5,-75.6],"ND":[46.0,-104.0,49.0,-96.6],"NE":[40.0,-104.0,42.9,-95.5],"NH":[42.7,-72.4,44.6,-70.8],"NJ":[39.0,-75.1,41.3,-74.0],"NM":[31.8,-109.0,36.8,-103.0],"NV":[35.9,-119.9,42.0,-114.8],"NY":[40.6,-79.3,45.0,-71.9],"OH":[38.8,-84.8,41.8,-80.6],"OK":[33.9,-101.6,37.0,-94.6],"OR":[42.0,-124.5,46.2,-117.0],"PA":[39.7,-80.5,42.1,-75.0],"PR":[18.0,-67.2,18.5,-65.6],"RI":[41.1,-71.8,42.0,-71.4],"SC":[32.2,-82.9,35.0,-78.7],"SD":[42.7,-103.8,45.9,-96.5],"TN":[35.0,-90.1,36.7,-82.1],"TX":[25.9,-106.4,36.5,-92.0],"UT":[37.0,-114.1,41.8,-109.3],"VA":[36.5,-83.3,39.2,-75.4],"VI":[17.7,-65.0,18.4,-64.8],"VT":[42.8,-73.3,45.0,-72.0],"WA":[45.6,-124.6,48.8,-117.1],"WI":[42.5,-92.7,46.8,-86.9],"WV":[37.2,-82.6,40.2,-77.9],"WY":[41.0,-111.1,45.0,-104.1]};
const boundsOf = ([s, w, n, e]) => L.latLngBounds([s, w], [n, e]);

// Being a polite guest of IEM: one state at a time, states the user has panned
// away from are dropped before they are fetched, finished days are kept in
// localStorage, and nothing is retried: a failure stays failed until a reload.
const pending = []; // states on screen, waiting their turn
const done = new Set(); // fetched or failed, either way not asked for again
let current = null, failed = 0;

function loadVisible() {
  const view = map.getBounds();
  pending.length = 0;
  for (const [state, box] of Object.entries(BOX)) {
    if (!done.has(state) && state !== current && view.contains(boundsOf(box))) pending.push(state);
  }
  next();
}

async function next() {
  if (current) return; // the running loop picks up whatever is pending
  while ((current = pending.shift() ?? null)) {
    status();
    await loadState(`${current}_ASOS`).catch((e) => { failed++; console.error(e); });
    done.add(current);
  }
  status();
  // Wettest last, so they sit on top where dots overlap.
  [...stations.values()].filter((s) => s.total !== null)
    .sort((a, b) => a.total - b.total).forEach((s) => s.marker.bringToFront());
}

function status() {
  $('msg').textContent = current
    ? `Loading ${current}${pending.length ? `, ${pending.length} more` : ''}…`
    : `${stations.size} stations · zoom out for more states` +
      (failed ? ` · ${failed} request${failed > 1 ? 's' : ''} failed, reload to retry` : '');
}

async function loadState(network) {
  const res = await fetch(`${IEM}/api/1/currents.json?network=${network}`);
  if (!res.ok) throw new Error(`${network}: HTTP ${res.status}`);
  for (const cur of (await res.json()).data) {
    // Today's total from the live feed, until (and unless) the daily summary has one.
    const days = DATES.map((day) => ({ day, precip: cur.local_date === day && cur.pday <= MAX_DAY ? num(cur.pday) : null }));
    const s = { cur, days, total: null, loaded: 0 };
    // bubblingMouseEvents off, or the map's own click handler closes the card.
    s.marker = L.circleMarker([cur.lat, cur.lon], { ...style(s), bubblingMouseEvents: false })
      .addTo(map).on('click', () => select(s));
    stations.set(`${network}|${cur.station}`, s);
  }
  // ponytail: one request per day (fewer once days are cached). IEM has no
  // multi-day endpoint that isn't rate-limited to about one request a second.
  await Promise.all(DATES.map((_, i) => loadDay(network, i).catch((e) => { failed++; console.error(e); })));
}

// A day is finished once it has ended in Hawaii, the last US zone to get there
// (Guam is ahead of everyone). Finished days don't change, so they are cached.
const lastZoneToday = new Date().toLocaleDateString('en-CA', { timeZone: 'Pacific/Honolulu' });
const cacheKey = (network, day) => `rain2:${day}:${network}`;
// The daily fields the card shows, in the order they are stored. Rows are cached
// as bare arrays in this order: the whole country is ~1 MB that way, where
// IEM's own row objects would overrun localStorage's ~5 MB.
const DAY_FIELDS = ['precip', 'max_tmpf', 'min_tmpf', 'max_gust', 'max_drct', 'max_gust_localts',
  'avg_sknt', 'vector_avg_drct', 'min_rh', 'max_rh', 'min_dwpf', 'max_dwpf',
  'min_feel', 'avg_feel', 'max_feel', 'snow', 'snowd', 'precip_est', 'tmpf_est'];
// Storage can be full, blocked or absent (private windows); the page works without it.
const stored = (fn) => { try { return fn(); } catch { return null; } };
// Drop days that have scrolled out of the window, and the older cache format.
stored(() => Object.keys(localStorage)
  .filter((k) => k.startsWith('rain:') || (k.startsWith('rain2:') && !DATES.includes(k.split(':')[1])))
  .forEach((k) => localStorage.removeItem(k)));

async function loadDay(network, i) {
  const day = DATES[i], key = cacheKey(network, day);
  let rows = stored(() => JSON.parse(localStorage.getItem(key)));
  if (!rows) {
    const res = await fetch(`${IEM}/api/1/daily.json?network=${network}&date=${day}`);
    if (!res.ok) throw new Error(`${network} ${day}: HTTP ${res.status}`);
    rows = (await res.json()).data.map((r) => [r.station, ...DAY_FIELDS.map((f) => r[f] ?? null)]);
    if (day < lastZoneToday && rows.length) stored(() => localStorage.setItem(key, JSON.stringify(rows)));
  }
  for (const [id, ...values] of rows) {
    const s = stations.get(`${network}|${id}`);
    if (!s) continue;
    const d = s.days[i];
    const { precip, ...rest } = Object.fromEntries(DAY_FIELDS.map((f, j) => [f, values[j]]));
    Object.assign(d, rest);
    if (precip > MAX_DAY) d.bad = precip; else d.precip = precip ?? d.precip;
    s.loaded++;
    s.total = totalOf(s.days);
    s.marker.setStyle(style(s)).setRadius(style(s).radius);
    if (s.total > 0) s.marker.bringToFront();
    if (s === selected) renderCard();
  }
}

// --- Station card ---
const fmtIn = (v) => (v === null ? '—' : v === TRACE ? 'trace' : v.toFixed(2) + '"');
const COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const mph = (kt) => Math.round(kt * 1.15078);
const compass = (deg) => COMPASS[Math.round(deg / 22.5) % 16];
const has = (v) => v !== null && v !== undefined;
const SKY = { CLR: 'clear', SKC: 'clear', FEW: 'few clouds', SCT: 'scattered', BKN: 'broken', OVC: 'overcast', VV: 'obscured' };

function select(s) {
  selected = s;
  $('card').hidden = !s;
  if (s) renderCard();
}

function renderCard() {
  const s = selected, c = s.cur;
  $('name').textContent = c.name;
  const age = Math.round((Date.now() - Date.parse(c.utc_valid)) / 60000);
  const ago = age < 90 ? `${age} min ago` : age < 2880 ? `${Math.round(age / 60)} h ago` : `${Math.round(age / 1440)} days ago`;
  $('meta').innerHTML =
    `<a href="${IEM}/sites/site.php?station=${encodeURIComponent(c.station)}&network=${encodeURIComponent(c.network)}" target="_blank" rel="noopener">${esc(c.station)}</a>` +
    // IEM drops the leading K from mainland IDs (SEA, 0S9); weather.gov wants it. Alaska, Hawaii
    // and the territories already have all four characters (PANC).
    ` · <a href="https://forecast.weather.gov/data/obhistory/${encodeURIComponent(c.station.length === 3 ? 'K' + c.station : c.station)}.html" target="_blank" rel="noopener">weather.gov</a>` +
    ` · ${esc([c.county && c.county + ' Co.', c.state].filter(Boolean).join(', '))}` +
    ` · reported ${esc(c.local_valid.slice(11, 16))} local (${ago})`;

  const max = Math.max(0.01, ...s.days.map((d) => inches(d.precip ?? 0)));
  const rain = s.loaded
    ? `<div class="big">${s.total === null ? 'no rain data' : s.total.toFixed(2) + '"'}</div>
       <table>
         <tr><th></th><th>rain</th><th></th><th>hi/lo °F</th></tr>
         ${s.days.map((d) => `<tr>
           <td>${dayName(d.day)}</td><td>${d.bad ? `${d.bad}" ignored, faulty gauge` : fmtIn(d.precip) + (d.precip_est ? ' est.' : '')}</td>
           <td class="bar"><i style="width:${(inches(d.precip ?? 0) / max) * 100}%;background:${BUCKETS[bucketOf(inches(d.precip ?? 0))][1]};outline:1px solid var(--coast)"></i></td>
           <td>${has(d.max_tmpf) && has(d.min_tmpf) ? Math.round(d.max_tmpf) + '/' + Math.round(d.min_tmpf) + (d.tmpf_est ? ' est.' : '') : '—'}</td></tr>`).join('')}
         <tr class="total"><td>Total</td><td>${fmtIn(s.total)}</td><td></td><td></td></tr>
       </table>`
    : '<div class="loading">Loading rain totals…</div>';

  // One row per measurement, one column per day. Rows no day reports are left out.
  const range = (lo, hi) => (has(lo) && has(hi) ? `${Math.round(lo)}–${Math.round(hi)}` : null);
  const daily = [
    ['Peak gust mph', (d) => has(d.max_gust) && `${mph(d.max_gust)}${has(d.max_drct) ? ' ' + compass(d.max_drct) : ''}`],
    ['Gust time', (d) => has(d.max_gust) && d.max_gust_localts && d.max_gust_localts.slice(11, 16)],
    ['Avg wind mph', (d) => has(d.avg_sknt) && `${mph(d.avg_sknt)}${has(d.vector_avg_drct) ? ' ' + compass(d.vector_avg_drct) : ''}`],
    ['Humidity %', (d) => range(d.min_rh, d.max_rh)],
    ['Dew point °F', (d) => range(d.min_dwpf, d.max_dwpf)],
    ['Feels like °F', (d) => range(d.min_feel, d.max_feel)],
    ['Feels avg °F', (d) => has(d.avg_feel) && Math.round(d.avg_feel)],
    ['Snowfall', (d) => has(d.snow) && fmtIn(d.snow)],
    ['Snow depth', (d) => has(d.snowd) && fmtIn(d.snowd)],
  ].map(([k, f]) => [k, s.days.map((d) => f(d) || '—')]).filter(([, cells]) => cells.some((v) => v !== '—'));
  const dailyTable = daily.length
    ? `<h3>Each day</h3><div class="scroll"><table>
         <tr><th></th>${s.days.map((d) => `<th>${dayName(d.day).split(',')[0]}</th>`).join('')}</tr>
         ${daily.map(([k, cells]) => `<tr><th>${k}</th>${cells.map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}
       </table></div>`
    : '';

  const at = (ts) => (ts ? ` at ${ts.slice(11, 16)}` : '');
  const list = (keys, fmt) => keys.filter((k) => has(c[k])).map((k) => fmt(c[k])).join(', ');
  // Only the rows this station actually reports. The soil and road rows exist
  // because IEM sends those fields; airport stations leave them empty.
  const rows = [
    ['Rain, last hour', has(c.phour) && fmtIn(c.phour)],
    ['Rain today, as reported', has(c.ob_pday) && fmtIn(c.ob_pday)],
    ['Rain this month, as reported', has(c.ob_pmonth) && fmtIn(c.ob_pmonth)],
    ['Rain this month, summed', has(c.s_pmonth) && fmtIn(c.s_pmonth)],
    ['Weather', c.wxcodes && [].concat(c.wxcodes).join(' ')],
    ['Temperature', has(c.tmpf) && `${Math.round(c.tmpf)} °F` + (has(c.feel) && Math.abs(c.feel - c.tmpf) >= 2 ? `, feels ${Math.round(c.feel)}` : '')],
    ['Today hi/lo', has(c.max_tmpf) && has(c.min_tmpf) && `${Math.round(c.max_tmpf)} / ${Math.round(c.min_tmpf)} °F`],
    ['Dew point', has(c.dwpf) && `${Math.round(c.dwpf)} °F`],
    ['Humidity', has(c.relh) && `${Math.round(c.relh)}%`],
    ['Wind', has(c.sknt) && (c.sknt === 0 ? 'calm' : `${has(c.drct) ? compass(c.drct) + ' ' : ''}${mph(c.sknt)} mph`) + (c.gust ? `, gusting ${mph(c.gust)}` : '')],
    ['Peak wind today', has(c.max_sknt) && `${mph(c.max_sknt)} mph${at(c.local_max_sknt_ts)}`],
    ['Peak gust today', has(c.max_gust) && `${mph(c.max_gust)} mph${at(c.local_max_gust_ts)}`],
    ['Sky', [1, 2, 3, 4].filter((i) => c['skyc' + i]).map((i) => (SKY[c['skyc' + i].trim()] ?? c['skyc' + i]) + (c['skyl' + i] ? ` ${c['skyl' + i].toLocaleString()} ft` : '')).join(', ')],
    ['Visibility', has(c.vsby) && `${c.vsby} mi`],
    ['Altimeter', has(c.alti) && `${c.alti.toFixed(2)} inHg`],
    ['Sea-level pressure', has(c.mslp) && `${c.mslp} mb`],
    ['Station pressure', has(c.pres) && `${c.pres}`],
    ['Ice accretion', [1, 3, 6].filter((n) => has(c[`ice_accretion_${n}hr`])).map((n) => `${fmtIn(c[`ice_accretion_${n}hr`])} in ${n} h`).join(', ')],
    ['Snow today', has(c.snow) && `${c.snow}"`],
    ['Snow depth', has(c.snowd) && `${c.snowd}"`],
    ['Snow water equivalent', has(c.snoww) && `${c.snoww}"`],
    ['Solar radiation', has(c.srad) && `${c.srad} W/m²`],
    ['Soil moisture', list(['c1smv', 'c2smv', 'c3smv', 'c4smv', 'c5smv'], (v) => `${v}%`)],
    ['Soil temperature', list(['c1tmpf', 'c2tmpf', 'c3tmpf', 'c4tmpf', 'c5tmpf'], (v) => `${Math.round(v)} °F`)],
    ['Pavement temperature', list(['tsf0', 'tsf1', 'tsf2', 'tsf3'], (v) => `${Math.round(v)} °F`)],
    ['Subsurface temperature', has(c.rwis_subf) && `${Math.round(c.rwis_subf)} °F`],
    ['Road condition', list(['scond0', 'scond1', 'scond2', 'scond3'], (v) => v)],
  ].filter(([, v]) => v);

  $('body').innerHTML =
    `<h3>Rain since ${dayName(DATES[0])}</h3>${rain}` + dailyTable +
    `<h3>Now</h3><table>${rows.map(([k, v]) => `<tr><th>${k}</th><td class="wrap">${esc(v)}</td></tr>`).join('')}</table>` +
    (c.raw ? `<h3>Raw report</h3><pre>${esc(c.raw)}</pre>` : '');
}

$('close').addEventListener('click', () => select(null));
map.on('click', () => select(null));

map.on('moveend', loadVisible);
map.fitBounds(boundsOf(BOX.WA)); // fires moveend, which loads Washington
</script>
</body>
</html>
