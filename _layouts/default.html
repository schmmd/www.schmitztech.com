<!doctype html><html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Schmitztech</title>
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Noto+Serif:400,700&display=swap">
    <link rel="stylesheet" type="text/css" href="{{ baseurl }}/assets/css/schmitztech.css">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    {% feed_meta %}
  </head>
  <body>
    <header>
      <div class="max-width-content">
        {% if page.url == "/" %}
        <img src="{{ baseurl }}/assets/img/ribbit-schmitztech.png" alt="Schmitztech" />
        {% else %}
        <h1>
          <a href="{{ baseurl }}/"><img src="{{ baseurl }}/assets/img/ribbit-schmitztech-small.png" alt="Schmitztech" /></a>
          <span>{{ page.title }}</span>
        </h1>
        {% endif %}
      </div>
    </header>
    <main>
      <div class="max-width-content">
          {{ content }}
      </div>
    </main>
    <footer>
      <div class="max-width-content">
        Michael Schmitz<br />
        <a href="mailto:michael@schmitztech.com">michael@schmitztech.com</a><br />
        <a href="http://github.com/schmmd">github.com/schmmd</a><br />
        <a href="http://linkedin.com/in/schmmd">linkedin.com/in/schmmd</a>
      </div>
    </footer>
  </body>
</html>
